name: Build Android APK & Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Loại build (debug hoặc release)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cài đặt JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Kiểm tra cấu trúc & Định vị thư mục Gradle
        id: locate_project
        run: |
          echo "=== Danh sách tệp tin trong repository ==="
          ls -la
          
          # Tìm vị trí file settings.gradle.kts hoặc settings.gradle
          SETTINGS_PATH=$(find . -maxdepth 3 -name "settings.gradle*" | head -n 1)
          
          if [ -z "$SETTINGS_PATH" ]; then
            echo "::error::Không tìm thấy settings.gradle.kts hoặc settings.gradle trong repository!"
            echo "=========================================================================="
            echo "NGUYÊN NHÂN: Repository trên GitHub chưa được push mã nguồn của ứng dụng."
            echo "Hiện tại trong repo có thể chỉ có file workflow (.github/workflows) mà chưa có:"
            echo "  - settings.gradle.kts"
            echo "  - build.gradle.kts"
            echo "  - app/"
            echo "  - gradle/"
            echo "HƯỚNG DẪN KHẮC PHỤC:"
            echo "1. Từ giao diện AI Studio, chọn menu (3 chấm hoặc Export) -> 'Push to GitHub'"
            echo "2. Hoặc tải ZIP về máy, giải nén và commit toàn bộ các file vào repository này."
            echo "=========================================================================="
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_PATH")
          echo "Đã tìm thấy dự án Gradle tại: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> $GITHUB_OUTPUT

      - name: Cấp quyền thực thi cho gradlew
        working-directory: ${{ steps.locate_project.outputs.project_dir }}
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
          else
            echo "Chưa có gradlew cục bộ, đang tạo gradle wrapper..."
            gradle wrapper
            chmod +x ./gradlew
          fi

      - name: Khởi tạo tệp môi trường .env
        working-directory: ${{ steps.locate_project.outputs.project_dir }}
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            touch .env
          fi

      - name: Khôi phục debug.keystore
        working-directory: ${{ steps.locate_project.outputs.project_dir }}
        run: |
          if [ -f debug.keystore.base64 ]; then
            echo "Đang giải mã debug.keystore từ base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            echo "Đang tạo mới debug.keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        if: "${{ github.event.inputs.build_type != 'release' }}"
        working-directory: ${{ steps.locate_project.outputs.project_dir }}
        run: |
          ./gradlew :app:assembleDebug --stacktrace

      - name: Build Release APK
        if: "${{ github.event.inputs.build_type == 'release' }}"
        working-directory: ${{ steps.locate_project.outputs.project_dir }}
        run: |
          ./gradlew :app:assembleRelease --stacktrace || ./gradlew :app:assembleDebug --stacktrace

      - name: Xác định vị trí tệp APK
        id: find_apk
        working-directory: ${{ steps.locate_project.outputs.project_dir }}
        run: |
          APK_PATH=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "Tìm thấy APK: $APK_PATH"
          echo "apk_path=${{ steps.locate_project.outputs.project_dir }}/$APK_PATH" >> $GITHUB_OUTPUT

      - name: Tải lên Artifacts (Tải APK trực tiếp từ GitHub)
        uses: actions/upload-artifact@v4
        with:
          name: Navitel-AutoReload-PIP-APK
          path: ${{ steps.locate_project.outputs.project_dir }}/app/build/outputs/apk/**/*.apk
          retention-days: 30

      - name: Tạo GitHub Release & Đính kèm APK (Nếu tạo tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.find_apk.outputs.apk_path }}
          name: "Bản phát hành ${{ github.ref_name }}"
          body: |
            ## Navitel AutoReload PIP - Android Box Car
            - Tự động tải lại Navitel khi có kết nối Internet
            - Hỗ trợ màn hình PIP 2 với Display ID động
            - Tải tệp `.apk` đính kèm bên dưới để cài đặt lên thiết bị Android Box.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
