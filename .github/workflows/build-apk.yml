name: Build Android APK & Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Loại build (debug hoặc release)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cài đặt JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Kiểm tra & Tự động tạo tệp cấu hình Gradle nếu bị thiếu
        id: locate_project
        run: |
          echo "=== Danh sách tệp tin trong repository hiện tại ==="
          ls -la
          
          # Tự động tạo settings.gradle.kts nếu bị thiếu khi commit lên repo
          if [ ! -f settings.gradle.kts ] && [ ! -f settings.gradle ]; then
            echo "Phát hiện thiếu settings.gradle.kts! Tự động tạo tệp cấu hình..."
            cat << 'EOF' > settings.gradle.kts
pluginManagement {
  repositories {
    google {
      content {
        includeGroupByRegex("com\\.android.*")
        includeGroupByRegex("com\\.google.*")
        includeGroupByRegex("androidx.*")
      }
    }
    mavenCentral()
    gradlePluginPortal()
  }
}

plugins { id("org.gradle.toolchains.foojay-resolver-convention") version "1.0.0" }

dependencyResolutionManagement {
  repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
  repositories {
    google()
    mavenCentral()
  }
}

rootProject.name = "NavitelAutoReloadPIP"

include(":app")
EOF
          fi

          # Tự động tạo build.gradle.kts gốc nếu bị thiếu
          if [ ! -f build.gradle.kts ] && [ ! -f build.gradle ]; then
            echo "Phát hiện thiếu build.gradle.kts gốc! Tự động tạo tệp cấu hình..."
            cat << 'EOF' > build.gradle.kts
plugins {
  alias(libs.plugins.android.application) apply false
  alias(libs.plugins.kotlin.compose) apply false
  alias(libs.plugins.google.devtools.ksp) apply false
  alias(libs.plugins.roborazzi) apply false
  alias(libs.plugins.secrets) apply false
  alias(libs.plugins.google.services) apply false
}
EOF
          fi

          # Tự động tạo gradle.properties nếu bị thiếu
          if [ ! -f gradle.properties ]; then
            echo "Tạo tệp gradle.properties..."
            cat << 'EOF' > gradle.properties
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
kotlin.code.style=official
android.nonTransitiveRClass=true
EOF
          fi

          echo "project_dir=." >> $GITHUB_OUTPUT

      - name: Cấp quyền thực thi cho gradlew
        working-directory: ${{ steps.locate_project.outputs.project_dir }}
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
          else
            echo "Chưa có gradlew cục bộ, đang tạo gradle wrapper..."
            gradle wrapper
            chmod +x ./gradlew
          fi

      - name: Khởi tạo tệp môi trường .env
        working-directory: ${{ steps.locate_project.outputs.project_dir }}
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            touch .env
          fi

      - name: Khôi phục debug.keystore
        working-directory: ${{ steps.locate_project.outputs.project_dir }}
        run: |
          if [ -f debug.keystore.base64 ]; then
            echo "Đang giải mã debug.keystore từ base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            echo "Đang tạo mới debug.keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        if: "${{ github.event.inputs.build_type != 'release' }}"
        working-directory: ${{ steps.locate_project.outputs.project_dir }}
        run: |
          ./gradlew :app:assembleDebug --stacktrace

      - name: Build Release APK
        if: "${{ github.event.inputs.build_type == 'release' }}"
        working-directory: ${{ steps.locate_project.outputs.project_dir }}
        run: |
          ./gradlew :app:assembleRelease --stacktrace || ./gradlew :app:assembleDebug --stacktrace

      - name: Xác định vị trí tệp APK
        id: find_apk
        working-directory: ${{ steps.locate_project.outputs.project_dir }}
        run: |
          APK_PATH=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "Tìm thấy APK: $APK_PATH"
          echo "apk_path=${{ steps.locate_project.outputs.project_dir }}/$APK_PATH" >> $GITHUB_OUTPUT

      - name: Tải lên Artifacts (Tải APK trực tiếp từ GitHub)
        uses: actions/upload-artifact@v4
        with:
          name: Navitel-AutoReload-PIP-APK
          path: ${{ steps.locate_project.outputs.project_dir }}/app/build/outputs/apk/**/*.apk
          retention-days: 30

      - name: Tạo GitHub Release & Đính kèm APK (Nếu tạo tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.find_apk.outputs.apk_path }}
          name: "Bản phát hành ${{ github.ref_name }}"
          body: |
            ## Navitel AutoReload PIP - Android Box Car
            - Tự động tải lại Navitel khi có kết nối Internet
            - Hỗ trợ màn hình PIP 2 với Display ID động
            - Tải tệp `.apk` đính kèm bên dưới để cài đặt lên thiết bị Android Box.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
