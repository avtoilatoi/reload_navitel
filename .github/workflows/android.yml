name: Build APK Android

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Thiết lập Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Tự động bổ sung file cấu hình dự án nếu thiếu
        run: |
          echo "Kiểm tra và chuẩn bị cấu hình..."
          # Tự động tạo settings.gradle.kts nếu repo thiếu
          if [ ! -f settings.gradle.kts ] && [ ! -f settings.gradle ]; then
            cat << 'EOF' > settings.gradle.kts
pluginManagement {
  repositories {
    google()
    mavenCentral()
    gradlePluginPortal()
  }
}
dependencyResolutionManagement {
  repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
  repositories {
    google()
    mavenCentral()
  }
}
rootProject.name = "NavitelAutoReloadPIP"
include(":app")
EOF
          fi

          # Tự động tạo build.gradle.kts gốc nếu repo thiếu
          if [ ! -f build.gradle.kts ] && [ ! -f build.gradle ]; then
            cat << 'EOF' > build.gradle.kts
plugins {
  alias(libs.plugins.android.application) apply false
  alias(libs.plugins.kotlin.compose) apply false
  alias(libs.plugins.google.devtools.ksp) apply false
  alias(libs.plugins.roborazzi) apply false
  alias(libs.plugins.secrets) apply false
  alias(libs.plugins.google.services) apply false
}
EOF
          fi

          # Tự động tạo gradle.properties nếu thiếu
          if [ ! -f gradle.properties ]; then
            cat << 'EOF' > gradle.properties
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
kotlin.code.style=official
android.nonTransitiveRClass=true
EOF
          fi

          # Tự động tạo .env nếu thiếu
          if [ ! -f .env ]; then
            touch .env
          fi

      - name: 4. Thiết lập Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: 5. Khởi tạo gradlew và debug keystore
        run: |
          if [ ! -f ./gradlew ]; then
            gradle wrapper --gradle-version 9.3.1
          fi
          chmod +x ./gradlew

          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: 6. Thực hiện Build file APK Debug
        run: |
          ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: 7. Tải file APK lên Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Navitel-PIP-AutoReload-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
