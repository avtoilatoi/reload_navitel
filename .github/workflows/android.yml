name: Build Android APK & Release

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Loại build (debug hoặc release)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cài đặt JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Khởi tạo tệp cấu hình Gradle nếu thiếu
        run: |
          echo "=== Kiểm tra danh sách tệp nguồn hiện tại ==="
          ls -la
          
          # 1. Tự động sinh settings.gradle.kts nếu repository chưa có
          if [ ! -f settings.gradle.kts ] && [ ! -f settings.gradle ]; then
            echo ">> Đang tạo settings.gradle.kts..."
            cat << 'EOF' > settings.gradle.kts
pluginManagement {
  repositories {
    google {
      content {
        includeGroupByRegex("com\\.android.*")
        includeGroupByRegex("com\\.google.*")
        includeGroupByRegex("androidx.*")
      }
    }
    mavenCentral()
    gradlePluginPortal()
  }
}

plugins { id("org.gradle.toolchains.foojay-resolver-convention") version "1.0.0" }

dependencyResolutionManagement {
  repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
  repositories {
    google()
    mavenCentral()
  }
}

rootProject.name = "NavitelAutoReloadPIP"

include(":app")
EOF
          fi

          # 2. Tự động sinh build.gradle.kts gốc nếu repository chưa có
          if [ ! -f build.gradle.kts ] && [ ! -f build.gradle ]; then
            echo ">> Đang tạo build.gradle.kts..."
            cat << 'EOF' > build.gradle.kts
plugins {
  alias(libs.plugins.android.application) apply false
  alias(libs.plugins.kotlin.compose) apply false
  alias(libs.plugins.google.devtools.ksp) apply false
  alias(libs.plugins.roborazzi) apply false
  alias(libs.plugins.secrets) apply false
  alias(libs.plugins.google.services) apply false
}
EOF
          fi

          # 3. Tự động sinh gradle.properties nếu chưa có
          if [ ! -f gradle.properties ]; then
            echo ">> Đang tạo gradle.properties..."
            cat << 'EOF' > gradle.properties
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
kotlin.code.style=official
android.nonTransitiveRClass=true
org.gradle.caching=true
org.gradle.configuration-cache=true
googleServices.missing.passthrough=true
EOF
          fi

          # 4. Đảm bảo có thư mục gradle/wrapper và file gradle-wrapper.properties
          mkdir -p gradle/wrapper
          if [ ! -f gradle/wrapper/gradle-wrapper.properties ]; then
            echo ">> Đang tạo gradle-wrapper.properties..."
            cat << 'EOF' > gradle/wrapper/gradle-wrapper.properties
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-9.3.1-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
EOF
          fi

          # 5. Khởi tạo tệp môi trường .env nếu chưa có
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

      - name: Thiết lập Gradle và cấp quyền gradlew
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Đảm bảo có script gradlew
        run: |
          if [ ! -f ./gradlew ]; then
            echo "Tạo gradlew bằng gradle wrapper..."
            gradle wrapper --gradle-version 9.3.1
          fi
          chmod +x ./gradlew

      - name: Khôi phục debug.keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            echo "Đang giải mã debug.keystore từ base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            echo "Đang tạo mới debug.keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        if: "${{ github.event.inputs.build_type != 'release' }}"
        run: |
          ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Build Release APK
        if: "${{ github.event.inputs.build_type == 'release' }}"
        run: |
          ./gradlew :app:assembleRelease --stacktrace --no-daemon || ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Xác định vị trí tệp APK
        id: find_apk
        run: |
          APK_PATH=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "Tìm thấy APK: $APK_PATH"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: Tải lên Artifacts (Tải APK trực tiếp từ GitHub)
        uses: actions/upload-artifact@v4
        with:
          name: Navitel-AutoReload-PIP-APK
          path: app/build/outputs/apk/**/*.apk
          retention-days: 30

      - name: Tạo GitHub Release & Đính kèm APK (Nếu tạo tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.find_apk.outputs.apk_path }}
          name: "Bản phát hành ${{ github.ref_name }}"
          body: |
            ## Navitel AutoReload PIP - Android Box Car
            - Tự động tải lại Navitel khi có kết nối Internet
            - Hỗ trợ màn hình PIP 2 với Display ID động
            - Tải tệp `.apk` đính kèm bên dưới để cài đặt lên thiết bị Android Box.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
